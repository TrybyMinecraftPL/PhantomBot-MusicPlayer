name: Build PhantomBot Music Player

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtbase
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build\Release\PhantomBotMusicPlayer.exe package\
          Copy-Item discord_social_sdk\bin\release\discord_partner_sdk.dll package\
          Copy-Item discord_social_sdk\bin\release\discord_krisp.dll package\
          $windeployqt = Get-ChildItem -Path $env:Qt6_DIR -Recurse -Filter windeployqt.exe | Select-Object -First 1
          & $windeployqt.FullName --release --no-translations package\PhantomBotMusicPlayer.exe
          "PhantomBot Music Player`n`nApplication ID: 1543541293102272522" | Set-Content package\START.txt -Encoding UTF8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomBotMusicPlayer-Windows11-x64
          path: package
