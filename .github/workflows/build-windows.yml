name: Build PhantomBot Music Player

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtDir = Join-Path $env:GITHUB_WORKSPACE "Qt\6.8.0\msvc2022_64"
          if (-not (Test-Path "$qtDir\lib\cmake\Qt6")) { throw "Nie znaleziono Qt6 w $qtDir" }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$qtDir"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build\Release\PhantomBotMusicPlayer.exe package\
          Copy-Item discord_social_sdk\bin\release\discord_partner_sdk.dll package\
          Copy-Item discord_social_sdk\bin\release\discord_krisp.dll package\
          $qtDir = Join-Path $env:GITHUB_WORKSPACE "Qt\6.8.0\msvc2022_64"
          $windeployqt = Join-Path $qtDir "bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "Nie znaleziono windeployqt.exe: $windeployqt" }
          & $windeployqt --release --no-translations package\PhantomBotMusicPlayer.exe
          @"
          PhantomBot Music Player

          Uruchomienie:
          1. Otworz PowerShell w tym folderze.
          2. Wpisz: `$env:DISCORD_APPLICATION_ID = "1543541293102272522"
          3. Uruchom: .\PhantomBotMusicPlayer.exe
          "@ | Set-Content package\START.txt -Encoding UTF8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomBotMusicPlayer-Windows11-x64
          path: package
          if-no-files-found: error
